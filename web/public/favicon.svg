<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="9" stroke="white" stroke-width="1.8" stroke-opacity="0.9" fill="none"/>
  
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20.5" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.2" fill="white"/>
  
  <!-- Small send arrow (bottom-right) -->
  <path d="M23 21l4 2.5-4 2.5v-1.8h-3.5v-1.4H23V21z" fill="white" fill-opacity="0.95"/>
</svg>
